<svg xmlns="http://www.w3.org/2000/svg" width="680" height="316" viewBox="0 0 680 316" role="img" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Multi-head attention</title>
<desc>Input vectors are processed by three attention heads in parallel, each with its own query, key and value weights. The head outputs are concatenated and mixed into output vectors.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="316" fill="#FFFFFF"/>
<text x="340" y="22" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Multi-head attention: several attention patterns in parallel</text><rect x="24" y="116" width="110" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="79.0" y="146.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#04342C">Input vectors</text><rect x="176" y="44" width="150" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="251.0" y="63.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#26215C">Head 1</text><text x="251.0" y="82.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#26215C">own Q, K, V weights</text><line x1="134" y1="146" x2="176" y2="72" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="326" y1="72" x2="390" y2="146" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="176" y="118" width="150" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="251.0" y="137.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#26215C">Head 2</text><text x="251.0" y="156.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#26215C">own Q, K, V weights</text><line x1="134" y1="146" x2="176" y2="146" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="326" y1="146" x2="390" y2="146" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="176" y="192" width="150" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="251.0" y="211.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#26215C">Head 3</text><text x="251.0" y="230.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#26215C">own Q, K, V weights</text><line x1="134" y1="146" x2="176" y2="220" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="326" y1="220" x2="390" y2="146" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="390" y="116" width="130" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="455.0" y="137.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Concatenate</text><text x="455.0" y="156.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">and mix</text><line x1="520" y1="146" x2="548" y2="146" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="548" y="116" width="110" height="60" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="603.0" y="146.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#4A1B0C">Output vectors</text><text x="340" y="280" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Each head runs the same attention recipe with its own learned weights,</text><text x="340" y="298" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">so different heads can pick up different relationships between tokens.</text>
</svg>
