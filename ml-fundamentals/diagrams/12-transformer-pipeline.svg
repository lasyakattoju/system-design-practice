<svg xmlns="http://www.w3.org/2000/svg" width="680" height="200" viewBox="0 0 680 200" role="img" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Transformer pipeline</title>
<desc>Text is split into tokens, turned into embeddings with position information, passed through N transformer blocks, converted to probabilities with softmax, and the next token is chosen.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="200" fill="#FFFFFF"/>
<rect x="22" y="60" width="108" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="76.0" y="83.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#04342C">Tokens</text><text x="76.0" y="102.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#04342C">“The cat sat”</text><rect x="154" y="60" width="108" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="208.0" y="83.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#04342C">Embeddings</text><text x="208.0" y="102.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#04342C">+ position info</text><rect x="286" y="60" width="108" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="340.0" y="83.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#26215C">Blocks × N</text><text x="340.0" y="102.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#26215C">attention + MLP</text><rect x="418" y="60" width="108" height="64" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="472.0" y="83.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Softmax</text><text x="472.0" y="102.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">scores → probs</text><rect x="550" y="60" width="108" height="64" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="604.0" y="83.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#4A1B0C">Next token</text><text x="604.0" y="102.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#4A1B0C">e.g. “on”</text><line x1="130" y1="92" x2="154" y2="92" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="262" y1="92" x2="286" y2="92" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="394" y1="92" x2="418" y2="92" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="526" y1="92" x2="550" y2="92" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><text x="340" y="24" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">From text to a next-token prediction</text><text x="340" y="160" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Each token becomes a vector, the blocks let the vectors exchange information,</text><text x="340" y="180" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">and the last vector is turned into a probability for every word in the vocabulary.</text>
</svg>
