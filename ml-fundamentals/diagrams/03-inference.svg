<svg xmlns="http://www.w3.org/2000/svg" width="680" height="210" viewBox="0 0 680 210" role="img" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Inference</title>
<desc>Features of a new house enter a trained model with frozen weights, which outputs a predicted price. There is no label, no loss, and no weight update.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="210" fill="#FFFFFF"/>
<rect x="40" y="40" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="125.0" y="59.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#04342C">New features</text><text x="125.0" y="78.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#04342C">1,700 sq ft, 3 bed, 8 yr</text><rect x="255" y="40" width="170" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="340.0" y="59.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#26215C">Trained model</text><text x="340.0" y="78.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#26215C">weights frozen</text><rect x="470" y="40" width="170" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="555.0" y="59.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#4A1B0C">Prediction</text><text x="555.0" y="78.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#4A1B0C">an estimated price</text><line x1="210" y1="68" x2="253" y2="68" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="425" y1="68" x2="468" y2="68" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="40" y="136" width="600" height="46" rx="8" fill="none" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 4"/><text x="340" y="159" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="400" fill="#5F5E5A">No label, no loss, no weight updates: just one forward pass</text>
</svg>
