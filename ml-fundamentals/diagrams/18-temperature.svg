<svg xmlns="http://www.w3.org/2000/svg" width="680" height="322" viewBox="0 0 680 322" role="img" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Temperature</title>
<desc>Three bar charts of next-token probabilities for mat, floor, sofa and moon at temperatures 0.5, 1 and 2. Low temperature concentrates probability on the top token; high temperature spreads it out.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="322" fill="#FFFFFF"/>
<text x="340" y="22" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Temperature reshapes the same scores</text><text x="120" y="52" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">T = 0.5</text><text x="120" y="72" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">sharper: more confident</text><rect x="32" y="122.39102218095971" width="32" height="109.60897781904029" rx="3" fill="#FAECE7" stroke="#993C1D"/><text x="48" y="111.39102218095971" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#5F5E5A">84%</text><text x="48" y="248" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">mat</text><rect x="80" y="217.1660379415846" width="32" height="14.833962058415416" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/><text x="96" y="206.1660379415846" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#5F5E5A">11%</text><text x="96" y="248" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">floor</text><rect x="128" y="226.54289032759175" width="32" height="5.457109672408242" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/><text x="144" y="215.54289032759175" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#5F5E5A">4%</text><text x="144" y="248" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">sofa</text><rect x="176" y="231.90004954986395" width="32" height="0.09995045013604784" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/><text x="192" y="220.90004954986395" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#5F5E5A">0.1%</text><text x="192" y="248" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">moon</text><line x1="20" y1="232" x2="220" y2="232" stroke="#888780"/><text x="340" y="52" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">T = 1</text><text x="340" y="72" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">as the model trained</text><rect x="252" y="151.8128300559518" width="32" height="80.18716994404821" rx="3" fill="#FAECE7" stroke="#993C1D"/><text x="268" y="140.8128300559518" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#5F5E5A">62%</text><text x="268" y="248" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">mat</text><rect x="300" y="202.50078873186408" width="32" height="29.49921126813593" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/><text x="316" y="191.50078873186408" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#5F5E5A">23%</text><text x="316" y="248" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">floor</text><rect x="348" y="214.10782392853517" width="32" height="17.89217607146483" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/><text x="364" y="203.10782392853517" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#5F5E5A">14%</text><text x="364" y="248" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">sofa</text><rect x="396" y="229.57855728364896" width="32" height="2.4214427163510375" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/><text x="412" y="218.57855728364896" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#5F5E5A">2%</text><text x="412" y="248" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">moon</text><line x1="240" y1="232" x2="440" y2="232" stroke="#888780"/><text x="560" y="52" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">T = 2</text><text x="560" y="72" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">flatter: more random</text><rect x="472" y="174.29073353237595" width="32" height="57.709266467624055" rx="3" fill="#FAECE7" stroke="#993C1D"/><text x="488" y="163.29073353237595" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#5F5E5A">44%</text><text x="488" y="248" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">mat</text><rect x="520" y="196.99756053785984" width="32" height="35.002439462140174" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/><text x="536" y="185.99756053785984" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#5F5E5A">27%</text><text x="536" y="248" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">floor</text><rect x="568" y="204.7400727374758" width="32" height="27.259927262524208" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/><text x="584" y="193.7400727374758" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#5F5E5A">21%</text><text x="584" y="248" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">sofa</text><rect x="616" y="221.97163319228844" width="32" height="10.028366807711572" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/><text x="632" y="210.97163319228844" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#5F5E5A">8%</text><text x="632" y="248" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">moon</text><line x1="460" y1="232" x2="660" y2="232" stroke="#888780"/><text x="340" y="280" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Same ranking every time: mat > floor > sofa > moon. Only the spread changes.</text><text x="340" y="300" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#2C2C2A">probability = softmax(scores / T)</text>
</svg>
