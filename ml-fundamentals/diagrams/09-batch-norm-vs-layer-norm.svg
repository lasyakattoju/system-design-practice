<svg xmlns="http://www.w3.org/2000/svg" width="680" height="280" viewBox="0 0 680 280" role="img" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Batch norm versus layer norm</title>
<desc>Two grids where rows are examples and columns are features. Batch norm normalizes down one column across all examples. Layer norm normalizes across one row, within a single example.</desc>
