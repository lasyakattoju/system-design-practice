<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320" role="img" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>A small neural network (MLP)</title>
<desc>Three input features connect through weighted links to four hidden units, which connect to one output prediction. A return arrow shows backpropagation adjusting the weights.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="320" fill="#FFFFFF"/>
<text x="110" y="26" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Features</text><text x="300" y="26" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Hidden layer</text><text x="490" y="26" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Prediction</text><line x1="110" y1="90" x2="300" y2="60" stroke="#7F77DD" stroke-width="3" stroke-linecap="round" opacity="0.7"/><line x1="110" y1="90" x2="300" y2="120" stroke="#7F77DD" stroke-width="0.5" stroke-linecap="round" opacity="0.7"/><line x1="110" y1="90" x2="300" y2="180" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/><line x1="110" y1="90" x2="300" y2="240" stroke="#7F77DD" stroke-width="0.5" stroke-linecap="round" opacity="0.7"/><line x1="110" y1="150" x2="300" y2="60" stroke="#7F77DD" stroke-width="1" stroke-linecap="round" opacity="0.7"/><line x1="110" y1="150" x2="300" y2="120" stroke="#7F77DD" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/><line x1="110" y1="150" x2="300" y2="180" stroke="#7F77DD" stroke-width="0.5" stroke-linecap="round" opacity="0.7"/><line x1="110" y1="150" x2="300" y2="240" stroke="#7F77DD" stroke-width="2" stroke-linecap="round" opacity="0.7"/><line x1="110" y1="210" x2="300" y2="60" stroke="#7F77DD" stroke-width="0.5" stroke-linecap="round" opacity="0.7"/><line x1="110" y1="210" x2="300" y2="120" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/><line x1="110" y1="210" x2="300" y2="180" stroke="#7F77DD" stroke-width="3" stroke-linecap="round" opacity="0.7"/><line x1="110" y1="210" x2="300" y2="240" stroke="#7F77DD" stroke-width="1" stroke-linecap="round" opacity="0.7"/><line x1="300" y1="60" x2="490" y2="150" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/><line x1="300" y1="120" x2="490" y2="150" stroke="#7F77DD" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/><line x1="300" y1="180" x2="490" y2="150" stroke="#7F77DD" stroke-width="0.8" stroke-linecap="round" opacity="0.7"/><line x1="300" y1="240" x2="490" y2="150" stroke="#7F77DD" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/><circle cx="110" cy="90" r="18" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><circle cx="110" cy="150" r="18" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><circle cx="110" cy="210" r="18" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><circle cx="300" cy="60" r="18" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><circle cx="300" cy="120" r="18" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><circle cx="300" cy="180" r="18" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><circle cx="300" cy="240" r="18" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><circle cx="490" cy="150" r="22" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="545" y="142" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Thicker line =</text><text x="545" y="160" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">bigger weight</text><path d="M490 280 L110 280" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><text x="300" y="304" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Backpropagation nudges every weight after each guess</text>
</svg>
