<svg xmlns="http://www.w3.org/2000/svg" width="680" height="346" viewBox="0 0 680 346" role="img" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Attention weights</title>
<desc>Bar chart of how much the word 'it' attends to each earlier word in 'The animal didn't cross the street because it'. The word 'animal' receives the most weight.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="346" fill="#FFFFFF"/>
<text x="340" y="22" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">How much “it” attends to each token (illustrative numbers)</text><rect x="48" y="261.0" width="44" height="9.0" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/><text x="70" y="249.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">3%</text><text x="70" y="288" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">The</text><rect x="126" y="105.0" width="44" height="165.0" rx="4" fill="#FAECE7" stroke="#993C1D"/><text x="148" y="93.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">55%</text><text x="148" y="288" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">animal</text><rect x="204" y="264.0" width="44" height="6.0" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/><text x="226" y="252.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">2%</text><text x="226" y="288" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">didn't</text><rect x="282" y="258.0" width="44" height="12.0" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/><text x="304" y="246.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">4%</text><text x="304" y="288" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">cross</text><rect x="360" y="264.0" width="44" height="6.0" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/><text x="382" y="252.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">2%</text><text x="382" y="288" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">the</text><rect x="438" y="210.0" width="44" height="60.0" rx="4" fill="#FAEEDA" stroke="#854F0B"/><text x="460" y="198.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">20%</text><text x="460" y="288" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">street</text><rect x="516" y="252.0" width="44" height="18.0" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/><text x="538" y="240.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">6%</text><text x="538" y="288" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">because</text><rect x="594" y="246.0" width="44" height="24.0" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/><text x="616" y="234.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">8%</text><text x="616" y="288" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">it</text><line x1="40" y1="270" x2="650" y2="270" stroke="#888780"/><text x="340" y="310" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Weights sum to 100%. “it” borrows mostly from “animal”, the thing it refers to.</text><text x="340" y="328" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Real models learn these patterns from data; these numbers only show the idea.</text>
</svg>
