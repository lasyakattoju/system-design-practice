<svg xmlns="http://www.w3.org/2000/svg" width="680" height="310" viewBox="0 0 680 310" role="img" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>A decision tree predicting house price</title>
<desc>The root asks whether square footage is over 1,500. No leads to 280 thousand dollars. Yes leads to a bedroom question, which leads to either 420 thousand or 610 thousand dollars.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="310" fill="#FFFFFF"/>
<line x1="300" y1="74" x2="185" y2="148" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="380" y1="74" x2="500" y2="128" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="500" y1="174" x2="435" y2="238" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="570" y1="174" x2="615" y2="238" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><text x="226" y="104" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">No</text><text x="458" y="92" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Yes</text><text x="450" y="212" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">No</text><text x="608" y="212" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Yes</text><rect x="255" y="30" width="170" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="340.0" y="52.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#26215C">Sq ft over 1,500?</text><rect x="455" y="130" width="160" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="535.0" y="152.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#26215C">4+ bedrooms?</text><rect x="110" y="150" width="110" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="165.0" y="169.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#4A1B0C">$280k</text><text x="165.0" y="188.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#4A1B0C">predicted price</text><rect x="360" y="240" width="110" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="415.0" y="259.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#4A1B0C">$420k</text><text x="415.0" y="278.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#4A1B0C">predicted price</text><rect x="540" y="240" width="110" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="595.0" y="259.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#4A1B0C">$610k</text><text x="595.0" y="278.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#4A1B0C">predicted price</text>
</svg>
