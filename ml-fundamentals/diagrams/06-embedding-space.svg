<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" role="img" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>An embedding space with three clusters</title>
<desc>Words are plotted as points. Animal words sit together, city names sit together, and vehicle words sit together.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="330" fill="#FFFFFF"/>
<rect x="50" y="30" width="260" height="130" rx="12" fill="none" stroke="#993C1D" stroke-width="1" stroke-dasharray="4 4"/><text x="66" y="54" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="600" fill="#4A1B0C">Animals</text><circle cx="90" cy="96" r="7" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="104" y="96" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">dog</text><circle cx="115" cy="130" r="7" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="129" y="130" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">puppy</text><circle cx="205" cy="108" r="7" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="219" y="108" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">cat</text><rect x="370" y="30" width="260" height="130" rx="12" fill="none" stroke="#0F6E56" stroke-width="1" stroke-dasharray="4 4"/><text x="386" y="54" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="600" fill="#04342C">Cities</text><circle cx="410" cy="98" r="7" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="424" y="98" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">Paris</text><circle cx="520" cy="86" r="7" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="534" y="86" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">London</text><circle cx="455" cy="136" r="7" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="469" y="136" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">Rome</text><rect x="210" y="195" width="260" height="110" rx="12" fill="none" stroke="#534AB7" stroke-width="1" stroke-dasharray="4 4"/><text x="226" y="219" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="600" fill="#26215C">Vehicles</text><circle cx="250" cy="260" r="7" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="264" y="260" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">car</text><circle cx="335" cy="277" r="7" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="349" y="277" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">truck</text><circle cx="400" cy="245" r="7" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="414" y="245" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">bus</text>
</svg>
