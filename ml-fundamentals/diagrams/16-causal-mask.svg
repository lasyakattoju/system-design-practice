<svg xmlns="http://www.w3.org/2000/svg" width="680" height="410" viewBox="0 0 680 410" role="img" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Causal mask</title>
<desc>A 5 by 5 grid for the tokens The cat sat on the. Each row can look at itself and earlier columns; later columns are masked.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="410" fill="#FFFFFF"/>
<text x="340" y="22" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Causal mask: each token sees only itself and earlier tokens</text><text x="310.0" y="52" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Token being looked at</text><text x="198.0" y="70" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">The</text><text x="254.0" y="70" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">cat</text><text x="310.0" y="70" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">sat</text><text x="366.0" y="70" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">on</text><text x="422.0" y="70" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">the</text><text x="158" y="108.0" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">The</text><rect x="172" y="82" width="52" height="52" rx="4" fill="#E1F5EE" stroke="#0F6E56" opacity="1"/><rect x="228" y="82" width="52" height="52" rx="4" fill="#F1EFE8" stroke="#5F5E5A" opacity="0.45"/><rect x="284" y="82" width="52" height="52" rx="4" fill="#F1EFE8" stroke="#5F5E5A" opacity="0.45"/><rect x="340" y="82" width="52" height="52" rx="4" fill="#F1EFE8" stroke="#5F5E5A" opacity="0.45"/><rect x="396" y="82" width="52" height="52" rx="4" fill="#F1EFE8" stroke="#5F5E5A" opacity="0.45"/><text x="158" y="164.0" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">cat</text><rect x="172" y="138" width="52" height="52" rx="4" fill="#E1F5EE" stroke="#0F6E56" opacity="1"/><rect x="228" y="138" width="52" height="52" rx="4" fill="#E1F5EE" stroke="#0F6E56" opacity="1"/><rect x="284" y="138" width="52" height="52" rx="4" fill="#F1EFE8" stroke="#5F5E5A" opacity="0.45"/><rect x="340" y="138" width="52" height="52" rx="4" fill="#F1EFE8" stroke="#5F5E5A" opacity="0.45"/><rect x="396" y="138" width="52" height="52" rx="4" fill="#F1EFE8" stroke="#5F5E5A" opacity="0.45"/><text x="158" y="220.0" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">sat</text><rect x="172" y="194" width="52" height="52" rx="4" fill="#E1F5EE" stroke="#0F6E56" opacity="1"/><rect x="228" y="194" width="52" height="52" rx="4" fill="#E1F5EE" stroke="#0F6E56" opacity="1"/><rect x="284" y="194" width="52" height="52" rx="4" fill="#E1F5EE" stroke="#0F6E56" opacity="1"/><rect x="340" y="194" width="52" height="52" rx="4" fill="#F1EFE8" stroke="#5F5E5A" opacity="0.45"/><rect x="396" y="194" width="52" height="52" rx="4" fill="#F1EFE8" stroke="#5F5E5A" opacity="0.45"/><text x="158" y="276.0" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">on</text><rect x="172" y="250" width="52" height="52" rx="4" fill="#E1F5EE" stroke="#0F6E56" opacity="1"/><rect x="228" y="250" width="52" height="52" rx="4" fill="#E1F5EE" stroke="#0F6E56" opacity="1"/><rect x="284" y="250" width="52" height="52" rx="4" fill="#E1F5EE" stroke="#0F6E56" opacity="1"/><rect x="340" y="250" width="52" height="52" rx="4" fill="#E1F5EE" stroke="#0F6E56" opacity="1"/><rect x="396" y="250" width="52" height="52" rx="4" fill="#F1EFE8" stroke="#5F5E5A" opacity="0.45"/><text x="158" y="332.0" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">the</text><rect x="172" y="306" width="52" height="52" rx="4" fill="#E1F5EE" stroke="#0F6E56" opacity="1"/><rect x="228" y="306" width="52" height="52" rx="4" fill="#E1F5EE" stroke="#0F6E56" opacity="1"/><rect x="284" y="306" width="52" height="52" rx="4" fill="#E1F5EE" stroke="#0F6E56" opacity="1"/><rect x="340" y="306" width="52" height="52" rx="4" fill="#E1F5EE" stroke="#0F6E56" opacity="1"/><rect x="396" y="306" width="52" height="52" rx="4" fill="#E1F5EE" stroke="#0F6E56" opacity="1"/><text x="30" y="210.0" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Token</text><text x="30" y="228.0" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">doing the</text><text x="30" y="246.0" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">looking</text><text x="470" y="150" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Row 3 (“sat”) can see</text><text x="470" y="168" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">The, cat, sat,</text><text x="470" y="186" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">but not on or the.</text><rect x="470" y="236" width="16" height="16" rx="3" fill="#E1F5EE" stroke="#0F6E56"/><text x="494" y="244" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">allowed to look at</text><rect x="470" y="262" width="16" height="16" rx="3" fill="#F1EFE8" stroke="#5F5E5A" opacity="0.45"/><text x="494" y="270" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">masked (future tokens)</text><text x="340" y="388" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">This lets every position predict its own next token in a single parallel pass during training.</text>
</svg>
