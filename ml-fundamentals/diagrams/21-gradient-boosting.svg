<svg xmlns="http://www.w3.org/2000/svg" width="680" height="260" viewBox="0 0 680 260" role="img" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Gradient boosting loop</title>
<desc>Start with the average prediction, compute residuals, fit a small tree to the residuals, add it scaled by the learning rate, and repeat.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="260" fill="#FFFFFF"/>
<text x="340" y="18" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Gradient boosting: each new tree fixes the remaining errors</text><rect x="30" y="50" width="130" height="70" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="95.0" y="76.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">1. Start</text><text x="95.0" y="95.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">predict the average</text><rect x="190" y="50" width="130" height="70" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="255.0" y="76.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#4A1B0C">2. Residuals</text><text x="255.0" y="95.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#4A1B0C">actual − predicted</text><rect x="350" y="50" width="130" height="70" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="415.0" y="76.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#26215C">3. Fit a tree</text><text x="415.0" y="95.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#26215C">to the residuals</text><rect x="510" y="50" width="140" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="580.0" y="76.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#04342C">4. Add it</text><text x="580.0" y="95.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#04342C">× learning rate</text><line x1="160" y1="85" x2="188" y2="85" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="320" y1="85" x2="348" y2="85" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="480" y1="85" x2="508" y2="85" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M580 122 L580 160 L255 160 L255 126" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><text x="418" y="178" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">repeat for hundreds of rounds</text><text x="340" y="214" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#2C2C2A">Final prediction = start + lr × tree 1 + lr × tree 2 + lr × tree 3 + ...</text><text x="340" y="236" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Each tree is weak on its own; the sum fits the pattern.</text>
</svg>
