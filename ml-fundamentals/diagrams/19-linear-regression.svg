<svg xmlns="http://www.w3.org/2000/svg" width="680" height="290" viewBox="0 0 680 290" role="img" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Linear regression</title>
<desc>Scatter plot of price against square feet with a fitted straight line. Dashed vertical segments show the residuals, the gaps between actual and predicted values.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="290" fill="#FFFFFF"/>
<text x="340" y="16" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Linear regression: fit the line that minimizes squared error</text><line x1="70" y1="250" x2="440" y2="250" stroke="#888780"/><line x1="70" y1="42" x2="70" y2="250" stroke="#888780"/><text x="255.0" y="274" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Square feet (feature)</text><text x="70" y="32" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Price (label)</text><line x1="107.0" y1="210.0" x2="107.0" y2="204.8" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="3 3"/><line x1="144.0" y1="174.0" x2="144.0" y2="189.5" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="3 3"/><line x1="181.0" y1="190.0" x2="181.0" y2="174.2" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="3 3"/><line x1="236.5" y1="140.0" x2="236.5" y2="151.2" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="3 3"/><line x1="273.5" y1="150.0" x2="273.5" y2="135.9" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="3 3"/><line x1="329.0" y1="94.0" x2="329.0" y2="113.0" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="3 3"/><line x1="384.5" y1="110.0" x2="384.5" y2="90.0" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="3 3"/><line x1="410.4" y1="70.0" x2="410.4" y2="79.3" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="3 3"/><line x1="81.1" y1="215.5" x2="421.5" y2="74.7" stroke="#7F77DD" stroke-width="2.5" stroke-linecap="round"/><circle cx="107.0" cy="210.0" r="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><circle cx="144.0" cy="174.0" r="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><circle cx="181.0" cy="190.0" r="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><circle cx="236.5" cy="140.0" r="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><circle cx="273.5" cy="150.0" r="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><circle cx="329.0" cy="94.0" r="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><circle cx="384.5" cy="110.0" r="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><circle cx="410.4" cy="70.0" r="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="470" y="80" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Line</text><text x="470" y="100" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="400" fill="#2C2C2A">ŷ = w · x + b</text><text x="470" y="112" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="400" fill="#2C2C2A"></text><text x="470" y="140" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Dashed lines</text><text x="470" y="160" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">residuals: actual minus</text><text x="470" y="177" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">predicted</text><text x="470" y="205" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Training picks w and b</text><text x="470" y="222" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">to minimize the sum of</text><text x="470" y="239" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">squared residuals.</text>
</svg>
