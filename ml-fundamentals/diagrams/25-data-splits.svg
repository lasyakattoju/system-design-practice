<svg xmlns="http://www.w3.org/2000/svg" width="680" height="444" viewBox="0 0 680 444" role="img" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Data splits</title>
<desc>A bar showing a 70, 15, 15 percent split into train, validation and test sets; a five-fold cross-validation grid where each fold takes a turn as validation; and a time-based split with past data for training and later data for validation and test.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="444" fill="#FFFFFF"/>
<text x="340" y="20" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Train / validation / test split</text><rect x="40" y="34" width="420" height="40" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="250" y="54" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#04342C">Train 70%</text><rect x="460" y="34" width="90" height="40" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="505" y="54" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#412402">Val 15%</text><rect x="550" y="34" width="90" height="40" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="595" y="54" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#4A1B0C">Test 15%</text><text x="250" y="94" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">fit the weights</text><text x="505" y="94" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">tune settings,</text><text x="505" y="110" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">early stopping</text><text x="595" y="94" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">final score,</text><text x="595" y="110" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">use once</text><text x="340" y="150" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">5-fold cross-validation (small datasets)</text><text x="80" y="176" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Fold 1</text><rect x="90" y="166" width="100" height="20" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><rect x="198" y="166" width="100" height="20" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><rect x="306" y="166" width="100" height="20" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><rect x="414" y="166" width="100" height="20" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><rect x="522" y="166" width="100" height="20" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="80" y="202" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Fold 2</text><rect x="90" y="192" width="100" height="20" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><rect x="198" y="192" width="100" height="20" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><rect x="306" y="192" width="100" height="20" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><rect x="414" y="192" width="100" height="20" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><rect x="522" y="192" width="100" height="20" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="80" y="228" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Fold 3</text><rect x="90" y="218" width="100" height="20" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><rect x="198" y="218" width="100" height="20" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><rect x="306" y="218" width="100" height="20" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><rect x="414" y="218" width="100" height="20" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><rect x="522" y="218" width="100" height="20" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="80" y="254" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Fold 4</text><rect x="90" y="244" width="100" height="20" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><rect x="198" y="244" width="100" height="20" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><rect x="306" y="244" width="100" height="20" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><rect x="414" y="244" width="100" height="20" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><rect x="522" y="244" width="100" height="20" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="80" y="280" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Fold 5</text><rect x="90" y="270" width="100" height="20" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><rect x="198" y="270" width="100" height="20" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><rect x="306" y="270" width="100" height="20" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><rect x="414" y="270" width="100" height="20" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><rect x="522" y="270" width="100" height="20" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="340" y="314" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Each fold takes a turn as validation; average the 5 scores.</text><text x="340" y="350" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Time-based split (ads, ranking, anything with time order)</text><rect x="40" y="364" width="420" height="36" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="250" y="382" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#04342C">Past: train</text><rect x="460" y="364" width="90" height="36" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="505" y="382" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#412402">Later: val</text><rect x="550" y="364" width="90" height="36" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="595" y="382" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#4A1B0C">Latest: test</text><text x="340" y="424" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Train on the past, evaluate on the future. A random shuffle would leak the future into training.</text>
</svg>
