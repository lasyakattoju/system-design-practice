<svg xmlns="http://www.w3.org/2000/svg" width="680" height="296" viewBox="0 0 680 296" role="img" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Attention step by step</title>
<desc>A query from one token is compared with the keys of all tokens to get scores. Softmax turns the scores into weights that sum to 1. The weights mix the values into an updated token.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="296" fill="#FFFFFF"/>
<text x="340" y="22" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Attention for one token, step by step</text><rect x="16" y="40" width="110" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="71.0" y="53.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#04342C">Query (Q)</text><text x="71.0" y="72.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#04342C">from “it”</text><rect x="16" y="108" width="110" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="71.0" y="121.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#04342C">Keys (K)</text><text x="71.0" y="140.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#04342C">one per token</text><rect x="152" y="74" width="100" height="58" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="202.0" y="94.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Scores</text><text x="202.0" y="113.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">q · k / √d</text><rect x="278" y="74" width="100" height="58" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="328.0" y="94.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Softmax</text><text x="328.0" y="113.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">sums to 1</text><rect x="404" y="74" width="110" height="58" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="459.0" y="94.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#26215C">Weighted sum</text><text x="459.0" y="113.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#26215C">of the Values</text><rect x="404" y="150" width="110" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="459.0" y="163.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#04342C">Values (V)</text><text x="459.0" y="182.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#04342C">one per token</text><rect x="540" y="74" width="124" height="58" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="602.0" y="94.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#4A1B0C">Updated token</text><text x="602.0" y="113.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#4A1B0C">“it” now carries “animal”</text><line x1="126" y1="66" x2="152" y2="94" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="126" y1="130" x2="152" y2="112" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="252" y1="103" x2="278" y2="103" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="378" y1="103" x2="404" y2="103" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="514" y1="103" x2="540" y2="103" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="459" y1="150" x2="459" y2="132" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><text x="30" y="226" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="600" fill="#04342C">Query:</text><text x="90" y="226" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="400" fill="#2C2C2A">what am I looking for?</text><text x="30" y="250" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="600" fill="#04342C">Key:</text><text x="90" y="250" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="400" fill="#2C2C2A">what do I offer, so I can be matched?</text><text x="30" y="274" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="600" fill="#04342C">Value:</text><text x="90" y="274" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="400" fill="#2C2C2A">the information I pass on if I am picked.</text>
</svg>
