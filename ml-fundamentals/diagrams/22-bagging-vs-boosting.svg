<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" role="img" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Bagging versus boosting</title>
<desc>Left: three deep trees trained independently and averaged, as in a random forest. Right: three shallow trees trained in sequence, each fixing the previous errors, with predictions summed, as in gradient boosting.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="300" fill="#FFFFFF"/>
<text x="170" y="22" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Bagging: random forest</text><text x="510" y="22" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Boosting: GBDT</text><rect x="40" y="56" width="110" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="95.0" y="76.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#04342C">Deep tree 1</text><line x1="150" y1="76" x2="208" y2="132" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="40" y="112" width="110" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="95.0" y="132.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#04342C">Deep tree 2</text><line x1="150" y1="132" x2="208" y2="132" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="40" y="168" width="110" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="95.0" y="188.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#04342C">Deep tree 3</text><line x1="150" y1="188" x2="208" y2="132" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="210" y="102" width="100" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="260.0" y="123.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Average</text><text x="260.0" y="142.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">of all trees</text><rect x="370" y="100" width="80" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="410.0" y="116.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#26215C">Tree 1</text><text x="410.0" y="135.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#26215C">fixes errors</text><rect x="470" y="100" width="80" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="510.0" y="116.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#26215C">Tree 2</text><text x="510.0" y="135.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#26215C">fixes errors</text><rect x="570" y="100" width="80" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="610.0" y="116.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#26215C">Tree 3</text><text x="610.0" y="135.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#26215C">fixes errors</text><line x1="450" y1="125" x2="470" y2="125" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="550" y1="125" x2="570" y2="125" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><text x="510" y="178" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#2C2C2A">Prediction = sum of all trees</text><text x="170" y="244" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Deep trees, trained independently,</text><text x="170" y="262" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">then averaged. Cuts variance.</text><text x="510" y="244" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Shallow trees, trained in sequence,</text><text x="510" y="262" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">each fixing the last one's errors.</text><text x="510" y="280" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Cuts bias.</text>
</svg>
