<svg xmlns="http://www.w3.org/2000/svg" width="680" height="316" viewBox="0 0 680 316" role="img" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>What changes during fine-tuning</title>
<desc>A pretrained model drawn as stacked layers. Early and middle layers are frozen. Late layers are trained gently. A new output head is trained from scratch.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="316" fill="#FFFFFF"/>
<rect x="60" y="24" width="340" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="230.0" y="41.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Early layers</text><text x="230.0" y="60.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">frozen: general patterns</text><rect x="60" y="96" width="340" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="230.0" y="113.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Middle layers</text><text x="230.0" y="132.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">frozen or barely changed</text><rect x="60" y="168" width="340" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="230.0" y="185.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#26215C">Late layers</text><text x="230.0" y="204.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#26215C">trained gently</text><rect x="60" y="240" width="340" height="52" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="230.0" y="257.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#412402">New output head</text><text x="230.0" y="276.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#412402">trained from scratch</text><line x1="230" y1="76" x2="230" y2="94" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="230" y1="148" x2="230" y2="166" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="230" y1="220" x2="230" y2="238" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><text x="430" y="57" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Learned once on huge,</text><text x="430" y="75" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">general data. Reused as is.</text><text x="430" y="177" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Adjusted slowly, with a</text><text x="430" y="195" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">small learning rate.</text><text x="430" y="249" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Brand new. Learns your</text><text x="430" y="267" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">task from your data.</text>
</svg>
