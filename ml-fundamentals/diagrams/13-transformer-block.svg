<svg xmlns="http://www.w3.org/2000/svg" width="680" height="490" viewBox="0 0 680 490" role="img" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>One transformer block</title>
<desc>Input vectors go through layer norm and multi-head attention, then a residual add; then layer norm and an MLP, then another residual add, producing output vectors.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="490" fill="#FFFFFF"/>
<text x="340" y="14" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">One transformer block (repeated N times)</text><rect x="210" y="40" width="200" height="38" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="310.0" y="59.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Input vectors</text><rect x="210" y="100" width="200" height="32" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="310.0" y="116.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Layer norm</text><rect x="210" y="152" width="200" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="310.0" y="169.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#26215C">Multi-head attention</text><text x="310.0" y="188.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#26215C">tokens look at each other</text><circle cx="310" cy="238" r="14" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="310" y="238" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="600" fill="#412402">+</text><rect x="210" y="268" width="200" height="32" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="310.0" y="284.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Layer norm</text><rect x="210" y="320" width="200" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="310.0" y="337.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#26215C">MLP</text><text x="310.0" y="356.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#26215C">each token on its own</text><circle cx="310" cy="406" r="14" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="310" y="406" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="600" fill="#412402">+</text><rect x="210" y="436" width="200" height="38" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="310.0" y="455.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Output vectors</text><line x1="310" y1="78" x2="310" y2="100" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="310" y1="132" x2="310" y2="152" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="310" y1="204" x2="310" y2="224" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="310" y1="252" x2="310" y2="268" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="310" y1="300" x2="310" y2="320" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="310" y1="372" x2="310" y2="392" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="310" y1="420" x2="310" y2="436" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M310 89 L160 89 L160 238 L294 238" fill="none" stroke="#854F0B" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/><path d="M310 260 L160 260 L160 406 L294 406" fill="none" stroke="#854F0B" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/><text x="148" y="164" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="600" fill="#854F0B">Residual shortcut:</text><text x="148" y="182" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">add the input back</text><text x="430" y="178" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Tokens exchange</text><text x="430" y="196" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">information here.</text><text x="430" y="346" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Each token is processed</text><text x="430" y="364" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">separately. Holds most of</text><text x="430" y="382" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">the parameters.</text>
</svg>
