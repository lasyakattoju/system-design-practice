<svg xmlns="http://www.w3.org/2000/svg" width="680" height="350" viewBox="0 0 680 350" role="img" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Logistic regression</title>
<desc>Features produce a linear score z, which a sigmoid curve converts to a probability between 0 and 1. The curve is plotted with markers at z of minus 2, 0 and 2.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="350" fill="#FFFFFF"/>
<text x="340" y="18" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Logistic regression: a linear score squashed into a probability</text><rect x="30" y="40" width="120" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="90.0" y="53.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#04342C">Features</text><text x="90.0" y="72.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#04342C">x</text><rect x="190" y="40" width="150" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="265.0" y="53.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Linear score</text><text x="265.0" y="72.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">z = w · x + b</text><rect x="380" y="40" width="130" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="445.0" y="53.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#26215C">Sigmoid</text><text x="445.0" y="72.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#26215C">1 / (1 + e^-z)</text><rect x="550" y="40" width="100" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="600.0" y="53.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#4A1B0C">Probability</text><text x="600.0" y="72.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#4A1B0C">between 0 and 1</text><line x1="150" y1="62" x2="188" y2="62" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="340" y1="62" x2="378" y2="62" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="510" y1="62" x2="548" y2="62" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="80" y1="300" x2="400" y2="300" stroke="#888780"/><line x1="80" y1="140" x2="80" y2="300" stroke="#888780"/><line x1="80" y1="220.0" x2="400" y2="220.0" stroke="#888780" stroke-dasharray="4 4"/><line x1="240.0" y1="140" x2="240.0" y2="300" stroke="#888780" stroke-dasharray="4 4"/><polyline points="80.0,299.6 86.7,299.5 93.3,299.3 100.0,299.2 106.7,298.9 113.3,298.6 120.0,298.2 126.7,297.7 133.3,297.1 140.0,296.3 146.7,295.3 153.3,294.0 160.0,292.4 166.7,290.4 173.3,287.9 180.0,284.7 186.7,280.9 193.3,276.3 200.0,270.8 206.7,264.4 213.3,257.0 220.0,248.7 226.7,239.6 233.3,229.9 240.0,220.0 246.7,210.1 253.3,200.4 260.0,191.3 266.7,183.0 273.3,175.6 280.0,169.2 286.7,163.7 293.3,159.1 300.0,155.3 306.7,152.1 313.3,149.6 320.0,147.6 326.7,146.0 333.3,144.7 340.0,143.7 346.7,142.9 353.3,142.3 360.0,141.8 366.7,141.4 373.3,141.1 380.0,140.8 386.7,140.7 393.3,140.5 400.0,140.4" fill="none" stroke="#7F77DD" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="186.7" cy="280.9" r="5" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="178.66666666666666" y="268.9275324764612" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">12%</text><circle cx="240.0" cy="220.0" r="5" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="230.0" y="208.0" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">50%</text><circle cx="293.3" cy="159.1" r="5" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="303.3333333333333" y="175.07246752353882" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">88%</text><text x="80.0" y="316" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">-6</text><text x="240.0" y="316" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">0</text><text x="400.0" y="316" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">6</text><text x="240.0" y="338" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">z (the linear score, any number)</text><text x="72" y="300" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">0</text><text x="72" y="220.0" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">0.5</text><text x="72" y="140" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">1</text><text x="440" y="170" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Decision rule</text><text x="440" y="192" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">p ≥ 0.5 exactly when z ≥ 0,</text><text x="440" y="209" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">so the boundary is a straight</text><text x="440" y="226" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">line (or plane) in feature space.</text><text x="440" y="256" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Training</text><text x="440" y="278" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Minimize cross-entropy with</text><text x="440" y="295" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">gradient descent. There is no</text><text x="440" y="312" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">closed-form solution.</text>
</svg>
