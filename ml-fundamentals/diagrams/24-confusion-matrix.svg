<svg xmlns="http://www.w3.org/2000/svg" width="680" height="304" viewBox="0 0 680 304" role="img" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Confusion matrix and metrics</title>
<desc>A two by two confusion matrix with 8 true positives, 2 false negatives, 12 false positives and 978 true negatives, with the precision, recall, accuracy and false positive rate calculations.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="304" fill="#FFFFFF"/>
<text x="340" y="22" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Confusion matrix: 1,000 transactions, 10 are fraud</text><text x="195.0" y="56" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Predicted fraud</text><text x="305.0" y="56" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Predicted not fraud</text><text x="130" y="105.0" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Actual fraud</text><text x="130" y="175.0" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Actual not fraud</text><rect x="142" y="72" width="106" height="66" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="195.0" y="98" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600" fill="#04342C">8</text><text x="195.0" y="122" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#04342C">caught (TP)</text><rect x="252" y="72" width="106" height="66" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="305.0" y="98" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600" fill="#412402">2</text><text x="305.0" y="122" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#412402">missed (FN)</text><rect x="142" y="142" width="106" height="66" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="195.0" y="168" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600" fill="#4A1B0C">12</text><text x="195.0" y="192" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#4A1B0C">false alarm (FP)</text><rect x="252" y="142" width="106" height="66" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="305.0" y="168" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600" fill="#2C2C2A">978</text><text x="305.0" y="192" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">correct pass (TN)</text><text x="390" y="70" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Precision</text><text x="390" y="90" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">TP / (TP + FP) = 8 / 20 = 40%</text><text x="390" y="118" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Recall</text><text x="390" y="138" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">TP / (TP + FN) = 8 / 10 = 80%</text><text x="390" y="166" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Accuracy</text><text x="390" y="186" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">(TP + TN) / all = 986 / 1000 = 98.6%</text><text x="390" y="214" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">False positive rate</text><text x="390" y="234" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">FP / (FP + TN) = 12 / 990 = 1.2%</text><text x="340" y="262" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#2C2C2A">Accuracy looks great at 98.6% while precision is only 40%.</text><text x="340" y="282" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">ROC curves use the false positive rate, which stays tiny here; PR curves expose the weak precision.</text>
</svg>
