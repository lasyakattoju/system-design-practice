<svg xmlns="http://www.w3.org/2000/svg" width="680" height="310" viewBox="0 0 680 310" role="img" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Next-token prediction in a language model</title>
<desc>The words 'the cat sat on the' enter a language model, which outputs probabilities for the next token. 'mat' has the highest probability at 62 percent and is also the true next token, the label.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="310" fill="#FFFFFF"/>
<rect x="120" y="24" width="80" height="34" rx="6" fill="#E1F5EE" stroke="#0F6E56"/><text x="160" y="41" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="400" fill="#04342C">The</text><rect x="210" y="24" width="80" height="34" rx="6" fill="#E1F5EE" stroke="#0F6E56"/><text x="250" y="41" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="400" fill="#04342C">cat</text><rect x="300" y="24" width="80" height="34" rx="6" fill="#E1F5EE" stroke="#0F6E56"/><text x="340" y="41" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="400" fill="#04342C">sat</text><rect x="390" y="24" width="80" height="34" rx="6" fill="#E1F5EE" stroke="#0F6E56"/><text x="430" y="41" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="400" fill="#04342C">on</text><rect x="480" y="24" width="80" height="34" rx="6" fill="#E1F5EE" stroke="#0F6E56"/><text x="520" y="41" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="400" fill="#04342C">the</text><line x1="340" y1="58" x2="340" y2="86" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="240" y="90" width="200" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="340.0" y="106.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#26215C">Language model</text><text x="340.0" y="125.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#26215C">scores every next token</text><line x1="340" y1="140" x2="340" y2="164" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><text x="140" y="187" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">mat</text><rect x="150" y="176" width="279.0" height="22" rx="4" fill="#FAECE7" stroke="#993C1D"/><text x="437.0" y="187" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">62%</text><text x="140" y="217" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">floor</text><rect x="150" y="206" width="90.0" height="22" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/><text x="248.0" y="217" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">20%</text><text x="140" y="247" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">sofa</text><rect x="150" y="236" width="49.5" height="22" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/><text x="207.5" y="247" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">11%</text><text x="140" y="277" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">moon</text><rect x="150" y="266" width="6" height="22" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/><text x="164" y="277" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">1%</text><text x="490" y="187" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="600" fill="#993C1D">true next token (the label)</text>
</svg>
