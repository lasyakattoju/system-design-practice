<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320" role="img" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Reliability diagram</title>
<desc>Predicted probability on the horizontal axis and observed rate on the vertical axis. A dashed diagonal shows perfect calibration. A coral curve below the diagonal shows an overconfident model.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="320" fill="#FFFFFF"/>
<line x1="80" y1="270" x2="440" y2="270" stroke="#888780"/><line x1="80" y1="30" x2="80" y2="270" stroke="#888780"/><line x1="80" y1="270" x2="440" y2="30" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 5"/><polyline points="116,258 188,222 260,186 332,150 404,107" fill="none" stroke="#D85A30" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="116" cy="258" r="5" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><circle cx="188" cy="222" r="5" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><circle cx="260" cy="186" r="5" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><circle cx="332" cy="150" r="5" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><circle cx="404" cy="107" r="5" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="80" y="18" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Actually happens</text><text x="80" y="288" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">0</text><text x="440" y="288" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">1</text><text x="260" y="306" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Predicted probability</text><text x="470" y="90" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Dashed line</text><text x="470" y="110" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">perfectly calibrated.</text><text x="470" y="128" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Says 70%, happens 70%.</text><text x="470" y="178" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Coral line</text><text x="470" y="198" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">overconfident model.</text><text x="470" y="216" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Says 90%, happens ~68%.</text>
</svg>
