<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320" role="img" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Bias-variance tradeoff</title>
<desc>Error against model complexity. Training error falls steadily. Validation error falls then rises. The left side is underfitting with high bias, the minimum is the sweet spot, and the right side is overfitting with high variance.</desc>
