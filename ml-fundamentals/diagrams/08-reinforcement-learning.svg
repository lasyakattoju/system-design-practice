<svg xmlns="http://www.w3.org/2000/svg" width="680" height="260" viewBox="0 0 680 260" role="img" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>The reinforcement learning loop</title>
<desc>An agent sends an action to an environment. The environment returns a new state and a reward. The agent updates its behavior to earn more reward.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="260" fill="#FFFFFF"/>
<rect x="60" y="50" width="170" height="90" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="145.0" y="86.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#26215C">Agent</text><text x="145.0" y="105.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#26215C">the model</text><rect x="450" y="50" width="170" height="90" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="535.0" y="86.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Environment</text><text x="535.0" y="105.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">the world it acts in</text><text x="340" y="66" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Action</text><line x1="232" y1="80" x2="448" y2="80" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="448" y1="112" x2="232" y2="112" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><text x="340" y="134" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">New state + reward</text><rect x="130" y="184" width="420" height="46" rx="8" fill="none" stroke="#993C1D" stroke-width="1" stroke-dasharray="4 4"/><text x="340" y="207" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="400" fill="#5F5E5A">Reward replaces the label: the agent keeps what earns more of it</text>
</svg>
