<svg xmlns="http://www.w3.org/2000/svg" width="680" height="310" viewBox="0 0 680 310" role="img" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>The training loop</title>
<desc>Features enter the model, which produces a prediction. The prediction is compared with the true label to compute a loss. The loss drives an update to the model's weights, which feeds back into the model.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="310" fill="#FFFFFF"/>
<rect x="505" y="30" width="125" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="567.5" y="49.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#4A1B0C">Label</text><text x="567.5" y="68.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#4A1B0C">the true answer</text><rect x="40" y="120" width="125" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="102.5" y="139.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#04342C">Features</text><text x="102.5" y="158.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#04342C">the inputs</text><rect x="195" y="120" width="125" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="257.5" y="139.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#26215C">Model</text><text x="257.5" y="158.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#26215C">makes a guess</text><rect x="350" y="120" width="125" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="412.5" y="139.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#4A1B0C">Prediction</text><text x="412.5" y="158.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#4A1B0C">its guess</text><rect x="505" y="120" width="125" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="567.5" y="139.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Loss</text><text x="567.5" y="158.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">how wrong?</text><rect x="505" y="230" width="125" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="567.5" y="249.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#26215C">Update model</text><text x="567.5" y="268.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#26215C">nudge weights</text><line x1="165" y1="148" x2="193" y2="148" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="320" y1="148" x2="348" y2="148" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="475" y1="148" x2="503" y2="148" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="567" y1="86" x2="567" y2="118" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="567" y1="176" x2="567" y2="228" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M503 258 L257 258 L257 180" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><text x="380" y="284" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">repeat over many batches of examples</text>
</svg>
